<section class="wrap">
  <h2>Recuperar contraseña</h2>
  <p class="subtitle">
    Escribe tu correo electrónico y te enviaremos un código de verificación para restablecer tu
    contraseña.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <div class="card">
      <label>
        Correo electrónico
        <input type="email" formControlName="email" placeholder="tu@correo.com" />
      </label>

      <div class="row actions">
        <button type="submit" class="btn primary" [disabled]="loading">Enviar código</button>
        <a routerLink="/sign-in" class="link">Volver al inicio de sesión</a>
      </div>

      <p class="hint" *ngIf="message" style="color: green">{{ message }}</p>
      <p class="hint" *ngIf="error" style="color: crimson">{{ error }}</p>
    </div>
  </form>
</section>
