<section class="wrap">
  <h2>Restablecer contraseña</h2>
  <p class="subtitle">
    Ingresa el correo con el que solicitaste el código, luego escríbelo junto a tu nueva
    contraseña.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <div class="card">
      <div class="grid">
        <label>
          Correo electrónico
          <input type="email" formControlName="email" placeholder="tu@correo.com" />
        </label>

        <label>
          Código recibido
          <input type="text" formControlName="code" placeholder="Ej. ABC123" />
        </label>

        <label>
          Nueva contraseña
          <input type="password" formControlName="newPassword" placeholder="Nueva contraseña" />
        </label>

        <label>
          Confirmar contraseña
          <input type="password" formControlName="confirmPassword" placeholder="Confirmar contraseña" />
        </label>
      </div>

      <p class="hint">
        Debe tener al menos 8 caracteres, incluyendo mayúsculas, minúsculas, números y símbolos.
      </p>

      <div class="row actions">
        <button type="submit" class="btn primary" [disabled]="loading">Restablecer</button>
        <a routerLink="/sign-in" class="link">Cancelar</a>
      </div>

      <p class="hint" *ngIf="message" style="color: green">{{ message }}</p>
      <p class="hint" *ngIf="error" style="color: crimson">{{ error }}</p>
    </div>
  </form>
</section>
