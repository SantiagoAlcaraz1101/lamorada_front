<section class="auth">
  <div class="shell">
    <header class="hero">
      <div class="brand">
        <img
          class="brand-logo-img"
          src="assets/lamorada-logo.png"
          alt="LaMorada"
          width="36"
          height="36"
          decoding="async"
        />
        <div class="brand-name">La<span class="accent">Morada</span></div>
      </div>
      <h2>Iniciar sesión</h2>
      <p>Entra a tu espacio de bienestar 💜</p>
    </header>

    <div class="card">
      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label class="label" for="signin-email">Email</label>
          <div class="input-wrap">
            <span class="ico">✉️</span>
            <input id="signin-email" type="email" autocomplete="username" required aria-describedby="signin-email-help" [attr.aria-invalid]="form.controls['email'].touched && form.controls['email'].invalid" placeholder="tucorreo@ejemplo.com" formControlName="email" />
          </div>
          <small id="signin-email-help">Usa un correo válido, por ejemplo nombre@dominio.com.</small>
          <small *ngIf="form.controls['email'].touched && form.controls['email'].invalid" role="alert">Escribe un correo electrónico válido.</small>
        </div>

        <div class="field">
          <label class="label" for="signin-password">Contraseña</label>
          <div class="input-wrap">
            <span class="ico">🔒</span>
            <input id="signin-password" type="password" autocomplete="current-password" required placeholder="Tu contraseña" formControlName="password" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" data-testid="signin-submit" [attr.aria-busy]="loading" [disabled]="loading || form.invalid">
            {{ loading ? 'Entrando…' : 'Entrar' }}
          </button>
        </div>

        <div *ngIf="err" class="banner err" role="alert" aria-live="assertive">{{ err }}</div>

        <p class="alt">
          ¿No tienes cuenta?
          <a routerLink="/sign-up">Regístrate</a>
        </p>
        <p class="alt">
          ¿Olvidaste tu contraseña?
          <a routerLink="/password-request" class="link">¿Olvidaste tu contraseña?</a>
        </p>
        
      </form>
    </div>
  </div>
</section>
